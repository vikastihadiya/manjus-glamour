<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reset Password — Manju's</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f7f3ed;
      color: #252321;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 32px;
      border-radius: 20px;
      border: 1px solid #e7dfd5;
      box-shadow: 0 10px 35px rgba(0,0,0,.07);
    }

    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-weight: 500;
    }

    p {
      color: #77716a;
      font-size: 14px;
      line-height: 1.6;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin: 18px 0 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #e7dfd5;
      border-radius: 10px;
      outline: none;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      margin-top: 18px;
      background: #b18a4a;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #8d6b35;
    }

    .message {
      margin-top: 15px;
      padding: 11px;
      border-radius: 9px;
      font-size: 13px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .error {
      background: #fae7e7;
      color: #922d2d;
    }

    .success {
      background: #e6f3eb;
      color: #2d6b4a;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #8d6b35;
      text-decoration: none;
      font-size: 13px;
    }

  </style>

</head>

<body>

  <div class="card">

    <h1>Reset Password</h1>

    <p id="description">
      Enter your new admin password below.
    </p>

    <form id="resetForm">

      <label for="newPassword">
        New password
      </label>

      <input
        id="newPassword"
        type="password"
        minlength="6"
        required
        autocomplete="new-password"
      >

      <label for="confirmPassword">
        Confirm password
      </label>

      <input
        id="confirmPassword"
        type="password"
        minlength="6"
        required
        autocomplete="new-password"
      >

      <button
        type="submit"
        id="resetButton"
      >
        Update Password
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </form>

    <a
      href="admin.html"
      class="back"
    >
      Back to Admin Login
    </a>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>

  <script>

    const supabaseClient =
      window.supabaseClient;

    const form =
      document.getElementById(
        "resetForm"
      );

    const message =
      document.getElementById(
        "message"
      );

    function showMessage(
      text,
      type
    ) {

      message.textContent = text;

      message.className =
        "message show " + type;
    }


    supabaseClient.auth.onAuthStateChange(
      (event, session) => {

        if (
          event === "PASSWORD_RECOVERY"
        ) {

          document
            .getElementById("description")
            .textContent =
              "Enter your new admin password below.";

        }

      }
    );


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const password =
          document
            .getElementById("newPassword")
            .value;

        const confirm =
          document
            .getElementById("confirmPassword")
            .value;

        if (password !== confirm) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;
        }

        const button =
          document.getElementById(
            "resetButton"
          );

        button.disabled = true;

        button.textContent =
          "Updating...";

        try {

          const {
            error
          } =
            await supabaseClient.auth.updateUser({
              password
            });

          if (error) {
            throw error;
          }

          showMessage(
            "Password updated successfully. You can now log in.",
            "success"
          );

          form.reset();

        } catch (error) {

          console.error(error);

          showMessage(
            error?.message ||
            "Unable to update password.",
            "error"
          );

        } finally {

          button.disabled = false;

          button.textContent =
            "Update Password";
        }

      }
    );

  </script>

</body>
</html>
