<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<!-- Favicon -->
<link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23f4eee7'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='55' font-family='Georgia,serif' fill='%232b2927'%3EM%3C/text%3E%3C/svg%3E"
>

<title>Admin Panel | Manju's The World of Glamour</title>

<meta
    name="description"
    content="Secure administration panel for Manju's The World of Glamour."
>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --ivory: #f8f5ef;
    --cream: #eee7dc;
    --charcoal: #262321;
    --gold: #b49663;
    --gold-dark: #8f7445;
    --white: #ffffff;
    --muted: #77716a;
    --border: #ddd5ca;
    --danger: #a33b3b;
    --success: #39734a;
}

body {
    min-height: 100vh;
    background: var(--ivory);
    color: var(--charcoal);
    font-family: Arial, Helvetica, sans-serif;
}

/* =====================================================
   LOGIN
===================================================== */

#loginSection {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.login-card {
    width: 100%;
    max-width: 450px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 42px 34px;
    box-shadow: 0 25px 70px rgba(0,0,0,.10);
}

.brand {
    text-align: center;
    margin-bottom: 30px;
}

.brand-small {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold-dark);
    margin-bottom: 10px;
}

.brand h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 30px;
    font-weight: 500;
    line-height: 1.2;
}

.brand p {
    margin-top: 10px;
    color: var(--muted);
    font-size: 14px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: #fff;
    color: var(--charcoal);
    font-size: 14px;
    outline: none;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(180,150,99,.12);
}

.login-btn {
    width: 100%;
    border: 0;
    border-radius: 9px;
    padding: 15px;
    background: var(--charcoal);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
}

.login-btn:hover {
    background: var(--gold-dark);
}

.message {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    display: none;
    font-size: 13px;
}

.message.error {
    display: block;
    background: #f9e8e8;
    color: var(--danger);
}

.message.success {
    display: block;
    background: #e8f4eb;
    color: var(--success);
}

.forgot,
.back-home {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: var(--gold-dark);
    text-decoration: none;
    font-size: 13px;
}

.back-home {
    color: var(--muted);
    margin-top: 22px;
}

/* =====================================================
   ADMIN PANEL
===================================================== */

#adminPanel {
    display: none;
    min-height: 100vh;
}

/* =====================================================
   TOP BAR
===================================================== */

.topbar {
    min-height: 72px;
    background: var(--charcoal);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 14px 28px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.topbar-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 21px;
}

.topbar-subtitle {
    color: #cfc8bd;
    font-size: 11px;
    margin-top: 3px;
    letter-spacing: 1px;
}

.logout-btn {
    border: 1px solid rgba(255,255,255,.35);
    background: transparent;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
}

.logout-btn:hover {
    background: rgba(255,255,255,.12);
}

/* =====================================================
   LAYOUT
===================================================== */

.admin-layout {
    display: grid;
    grid-template-columns: 250px minmax(0,1fr);
    min-height: calc(100vh - 72px);
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {
    background: #fff;
    border-right: 1px solid var(--border);
    padding: 20px 14px;
}

.sidebar-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--gold-dark);
    padding: 10px 12px;
    margin-bottom: 8px;
}

.nav-btn {
    width: 100%;
    display: block;
    border: 0;
    background: transparent;
    text-align: left;
    padding: 12px 13px;
    margin-bottom: 4px;
    border-radius: 8px;
    color: var(--charcoal);
    cursor: pointer;
    font-size: 14px;
}

.nav-btn:hover,
.nav-btn.active {
    background: var(--cream);
    color: var(--gold-dark);
}

/* =====================================================
   CONTENT
===================================================== */

.main-content {
    min-width: 0;
    padding: 28px;
}

.module-header {
    margin-bottom: 25px;
}

.module-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 32px;
    font-weight: 500;
}

.module-description {
    margin-top: 7px;
    color: var(--muted);
    font-size: 14px;
}

#moduleArea {
    display: block;
}

#moduleContent {
    min-height: 300px;
}

/* =====================================================
   DASHBOARD
===================================================== */

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 16px;
}

.dashboard-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 22px;
    cursor: pointer;
    transition: .2s ease;
}

.dashboard-card:hover {
    transform: translateY(-2px);
    border-color: var(--gold);
    box-shadow: 0 10px 30px rgba(0,0,0,.07);
}

.dashboard-card h3 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 28px;
    font-weight: 500;
}

.dashboard-card p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 7px;
}

/* =====================================================
   ADMIN CARDS
===================================================== */

.admin-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 16px;
}

.admin-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 20px;
}

.admin-card h3 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 21px;
    font-weight: 500;
}

.admin-card p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 8px;
    line-height: 1.5;
}

/* =====================================================
   COMMON MODULE
===================================================== */

.admin-module {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    overflow-x: auto;
}

.module-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.primary-btn {
    border: 0;
    background: var(--charcoal);
    color: #fff;
    padding: 11px 16px;
    border-radius: 8px;
    cursor: pointer;
}

.primary-btn:hover {
    background: var(--gold-dark);
}

.secondary-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--charcoal);
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
}

.secondary-btn:hover {
    border-color: var(--gold);
}

.danger-btn,
.delete-btn {
    border: 0;
    background: #f5dddd;
    color: var(--danger);
    padding: 9px 12px;
    border-radius: 7px;
    cursor: pointer;
}

.delete-btn:hover,
.danger-btn:hover {
    background: #efd0d0;
}

/* =====================================================
   TABLE
===================================================== */

.admin-table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    font-size: 13px;
    vertical-align: top;
}

th {
    color: var(--gold-dark);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

tr:hover td {
    background: #fcfaf7;
}

/* =====================================================
   EMPTY / LOADING
===================================================== */

.empty-state {
    padding: 50px 20px;
    text-align: center;
    color: var(--muted);
}

.module-loading {
    padding: 50px;
    text-align: center;
    color: var(--muted);
}

/* =====================================================
   FORMS
===================================================== */

.admin-form {
    display: grid;
    gap: 15px;
}

.admin-form-card {
    background: #fbf8f3;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 22px;
}

.admin-form-card h3 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 18px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 15px;
}

.form-row {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 15px;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
}

/* =====================================================
   CHECKBOX
===================================================== */

input[type="checkbox"] {
    width: auto;
    margin-right: 8px;
}

/* =====================================================
   IMAGE
===================================================== */

.admin-image {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
}

/* =====================================================
   MESSAGE
===================================================== */

#adminMessage {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 9999;
    max-width: 360px;
    padding: 14px 18px;
    border-radius: 10px;
    background: var(--charcoal);
    color: #fff;
    box-shadow: 0 12px 40px rgba(0,0,0,.18);
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 1000px) {

    .admin-grid,
    .dashboard-grid {
        grid-template-columns: repeat(2,minmax(0,1fr));
    }

    .admin-layout {
        grid-template-columns: 210px minmax(0,1fr);
    }
}

@media (max-width: 700px) {

    .topbar {
        padding: 14px 16px;
    }

    .topbar-title {
        font-size: 17px;
    }

    .admin-layout {
        display: block;
    }

    .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
        white-space: nowrap;
        padding: 10px;
    }

    .sidebar-title {
        display: none;
    }

    .nav-btn {
        width: auto;
        display: inline-block;
        margin-right: 4px;
    }

    .main-content {
        padding: 18px 14px;
    }

    .module-title {
        font-size: 27px;
    }

    .admin-grid,
    .dashboard-grid {
        grid-template-columns: 1fr;
    }

    .form-row,
    .form-grid {
        grid-template-columns: 1fr;
    }

    .login-card {
        padding: 32px 22px;
    }

    .admin-module {
        padding: 16px;
    }

}

</style>

</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginSection">

    <div class="login-card">

        <div class="brand">

            <div class="brand-small">
                Private Administration
            </div>

            <h1>
                Manju's The World of Glamour
            </h1>

            <p>
                Secure Admin Panel
            </p>

        </div>

        <form id="loginForm">

            <div class="form-group">

                <label for="adminEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="adminPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-btn"
            >
                SIGN IN
            </button>

            <div
                id="loginMessage"
                class="message"
            ></div>

        </form>

        <a
            href="reset-password.html"
            class="forgot"
        >
            Forgot password?
        </a>

        <a
            href="index.html"
            class="back-home"
        >
            ← Back to website
        </a>

    </div>

</section>


<!-- =====================================================
     ADMIN PANEL
===================================================== -->

<section id="adminPanel">

    <header class="topbar">

        <div>

            <div class="topbar-title">
                Manju's The World of Glamour
            </div>

            <div class="topbar-subtitle">
                ADMINISTRATION
            </div>

        </div>

        <button
            id="logoutBtn"
            class="logout-btn"
            type="button"
        >
            Logout
        </button>

    </header>


    <div class="admin-layout">

        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar">

            <div class="sidebar-title">
                Management
            </div>

            <button
                type="button"
                class="nav-btn active"
                data-module="dashboard"
            >
                Dashboard
            </button>

            <button
                type="button"
                class="nav-btn"
                data-module="appointments"
            >
                Appointments
            </button>

            <button
                type="button"
                class="nav-btn"
                data-module="services"
            >
                Services
            </button>

            <button
                type="button"
                class="nav-btn"
                data-module="offers"
            >
                Offers
            </button>

            <button
                type="button"
                class="nav-btn"
                data-module="gallery"
            >
                Our Work Gallery
            </button>

            <button
                type="button"
                class="nav-btn"
                data-module="bride_gallery"
            >
                Bride / Girls Gallery
            </button>

            <button
                type="button"
                class="nav-btn"
                data-module="customer_gallery"
            >
                Customer Gallery
            </button>

            <button
                type="button"
                class="nav-btn"
                data-module="before_after"
            >
                Before / After
            </button>

            <button
                type="button"
                class="nav-btn"
                data-module="bridal_packages"
            >
                Bridal Packages
            </button>

            <button
                type="button"
                class="nav-btn"
                data-module="team"
            >
                Team
            </button>

            <button
                type="button"
                class="nav-btn"
                data-module="testimonials"
            >
                Testimonials
            </button>

            <button
                type="button"
                class="nav-btn"
                data-module="faqs"
            >
                FAQs
            </button>

            <button
                type="button"
                class="nav-btn"
                data-module="settings"
            >
                Settings
            </button>

        </aside>


        <!-- =================================================
             MAIN CONTENT
        ================================================== -->

        <main class="main-content">

            <div id="moduleArea">

                <div class="module-header">

                    <h1
                        id="moduleTitle"
                        class="module-title"
                    >
                        Dashboard
                    </h1>

                    <p
                        id="moduleDescription"
                        class="module-description"
                    >
                        Manage your beauty business website.
                    </p>

                </div>

                <div id="moduleContent">

                    <div class="module-loading">
                        Loading dashboard...
                    </div>

                </div>

            </div>

        </main>

    </div>

</section>


<!-- =====================================================
     SUPABASE
===================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="supabase-config.js"></script>

<script src="admin.js"></script>


</body>
</html>
