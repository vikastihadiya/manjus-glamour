<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Manju's The World of Glamour - Admin Panel"
  >

  <title>Manju's — Admin Panel</title>

  <link
    rel="icon"
    href="favicon.ico"
  >

  <style>
    :root {
      --bg: #f7f3ed;
      --card: #ffffff;
      --text: #252321;
      --muted: #77716a;
      --border: #e7dfd5;
      --gold: #b18a4a;
      --gold-dark: #8d6b35;
      --danger: #b33a3a;
      --success: #347a55;
      --sidebar: #211e1b;
      --sidebar-text: #eee8df;
      --shadow: 0 10px 35px rgba(0,0,0,.07);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* =====================================================
       LOGIN
       ===================================================== */

    #loginSection {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at top right,
          rgba(177,138,74,.16),
          transparent 35%
        ),
        var(--bg);
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 36px;
      box-shadow: var(--shadow);
    }

    .login-brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-brand h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-weight: 500;
      font-size: 30px;
    }

    .login-brand p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      padding: 12px 13px;
      outline: none;
      color: var(--text);
    }

    .field textarea {
      min-height: 110px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(177,138,74,.10);
    }

    .primary-btn,
    .secondary-btn,
    .danger-btn,
    .small-btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      transition: .2s ease;
    }

    .primary-btn {
      background: var(--gold);
      color: white;
      width: 100%;
      font-weight: 700;
    }

    .primary-btn:hover {
      background: var(--gold-dark);
    }

    .secondary-btn {
      background: #eee8df;
      color: var(--text);
    }

    .secondary-btn:hover {
      background: #e5ddd3;
    }

    .danger-btn {
      background: #f8e4e4;
      color: var(--danger);
    }

    .danger-btn:hover {
      background: #f2d5d5;
    }

    .small-btn {
      padding: 7px 11px;
      font-size: 12px;
    }

    .login-links {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
    }

    .login-links a {
      color: var(--gold-dark);
      text-decoration: none;
    }

    .message {
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fae7e7;
      color: #9a2929;
    }

    .message.success {
      background: #e6f3eb;
      color: #2d6b4a;
    }

    /* =====================================================
       ADMIN LAYOUT
       ===================================================== */

    #adminPanel {
      min-height: 100vh;
    }

    .admin-layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 250px 1fr;
    }

    .sidebar {
      background: var(--sidebar);
      color: var(--sidebar-text);
      padding: 22px 15px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-brand {
      padding: 8px 12px 22px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      margin-bottom: 14px;
    }

    .sidebar-brand h2 {
      font-family: Georgia, serif;
      font-weight: 500;
      font-size: 21px;
      margin: 0;
    }

    .sidebar-brand span {
      display: block;
      color: #bcae9b;
      margin-top: 5px;
      font-size: 11px;
    }

    .nav-title {
      color: #9c938a;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 18px 12px 8px;
    }

    .nav-btn {
      width: 100%;
      display: block;
      text-align: left;
      border: 0;
      background: transparent;
      color: #ddd5cc;
      padding: 10px 12px;
      border-radius: 9px;
      margin-bottom: 3px;
      font-size: 13px;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: rgba(255,255,255,.09);
      color: white;
    }

    .sidebar-bottom {
      margin-top: 22px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,.10);
    }

    .logout-btn {
      width: 100%;
      border: 1px solid rgba(255,255,255,.12);
      background: transparent;
      color: #eee;
      padding: 10px;
      border-radius: 9px;
    }

    .main {
      min-width: 0;
    }

    .topbar {
      height: 72px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-weight: 500;
      font-size: 25px;
    }

    .user-email {
      color: var(--muted);
      font-size: 12px;
    }

    .content {
      padding: 30px;
      max-width: 1500px;
      margin: 0 auto;
    }

    .module-description {
      color: var(--muted);
      margin: 0 0 24px;
      font-size: 14px;
    }

    /* =====================================================
       DASHBOARD
       ===================================================== */

    .dashboard-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
    }

    .dashboard-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,.035);
      cursor: pointer;
      transition: .2s ease;
    }

    .dashboard-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .dashboard-card .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 12px;
    }

    .dashboard-card .count {
      font-size: 29px;
      font-weight: 700;
    }

    /* =====================================================
       FORMS
       ===================================================== */

    .admin-form-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,.03);
    }

    .admin-form-card h3 {
      margin: 0 0 18px;
      font-family: Georgia, serif;
      font-weight: 500;
    }

    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 9px 0;
      font-size: 13px;
    }

    .checkbox-field input {
      width: 16px;
      height: 16px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    /* =====================================================
       TABLE
       ===================================================== */

    .admin-table-wrap {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,.03);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      padding: 13px 15px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 13px;
      vertical-align: top;
    }

    th {
      background: #faf8f5;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .empty-state {
      background: white;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 35px;
      text-align: center;
      color: var(--muted);
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #eee8df;
      font-size: 11px;
    }

    .image-thumb {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 9px;
      border: 1px solid var(--border);
    }

    .image-preview {
      max-width: 180px;
      max-height: 180px;
      border-radius: 12px;
      border: 1px solid var(--border);
      object-fit: cover;
      margin-top: 8px;
    }

    .action-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .admin-alert {
      padding: 13px 15px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 13px;
    }

    .admin-alert.error {
      background: #fae7e7;
      color: #8e2929;
    }

    .admin-alert.success {
      background: #e6f3eb;
      color: #2d6b4a;
    }

    .loading {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    .mobile-menu-btn {
      display: none;
      border: 0;
      background: #eee8df;
      border-radius: 9px;
      padding: 9px 11px;
    }

    @media (max-width: 850px) {
      .admin-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        width: 250px;
        z-index: 100;
        transition: .25s ease;
      }

      .sidebar.open {
        left: 0;
      }

      .mobile-menu-btn {
        display: block;
      }

      .topbar {
        padding: 0 17px;
      }

      .content {
        padding: 20px 15px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .user-email {
        display: none;
      }
    }

    @media (max-width: 500px) {
      .login-card {
        padding: 25px 20px;
      }

      .topbar h1 {
        font-size: 20px;
      }

      .dashboard-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       LOGIN
       ===================================================== -->

  <section id="loginSection">

    <div class="login-card">

      <div class="login-brand">
        <h1>Manju's</h1>
        <p>The World of Glamour · Admin</p>
      </div>

      <form id="loginForm">

        <div class="field">
          <label for="adminEmail">Email</label>

          <input
            id="adminEmail"
            type="email"
            autocomplete="email"
            required
            placeholder="Admin email"
          >
        </div>

        <div class="field">
          <label for="adminPassword">Password</label>

          <input
            id="adminPassword"
            type="password"
            autocomplete="current-password"
            required
            placeholder="Password"
          >
        </div>

        <button
          type="submit"
          class="primary-btn"
          id="loginBtn"
        >
          Sign In
        </button>

        <div
          id="loginMessage"
          class="message"
        ></div>

      </form>

      <div class="login-links">
        <a href="reset-password.html">
          Forgot password?
        </a>
      </div>

    </div>

  </section>


  <!-- =====================================================
       ADMIN PANEL
       ===================================================== -->

  <section
    id="adminPanel"
    class="hidden"
  >

    <div class="admin-layout">

      <!-- SIDEBAR -->

      <aside
        id="sidebar"
        class="sidebar"
      >

        <div class="sidebar-brand">
          <h2>Manju's</h2>
          <span>THE WORLD OF GLAMOUR</span>
        </div>

        <div class="nav-title">Main</div>

        <button
          class="nav-btn"
          data-module="dashboard"
        >
          Dashboard
        </button>

        <button
          class="nav-btn"
          data-module="appointments"
        >
          Appointments
        </button>

        <div class="nav-title">Content</div>

        <button
          class="nav-btn"
          data-module="categories"
        >
          Categories
        </button>

        <button
          class="nav-btn"
          data-module="services"
        >
          Services
        </button>

        <button
          class="nav-btn"
          data-module="offers"
        >
          Offers
        </button>

        <button
          class="nav-btn"
          data-module="gallery"
        >
          Our Work
        </button>

        <button
          class="nav-btn"
          data-module="bride_gallery"
        >
          Bride & Girls
        </button>

        <button
          class="nav-btn"
          data-module="customer_gallery"
        >
          Customers
        </button>

        <button
          class="nav-btn"
          data-module="before_after"
        >
          Before / After
        </button>

        <button
          class="nav-btn"
          data-module="bridal_packages"
        >
          Bridal Packages
        </button>

        <button
          class="nav-btn"
          data-module="team"
        >
          Team
        </button>

        <button
          class="nav-btn"
          data-module="testimonials"
        >
          Testimonials
        </button>

        <button
          class="nav-btn"
          data-module="faqs"
        >
          FAQs
        </button>

        <div class="nav-title">Website</div>

        <button
          class="nav-btn"
          data-module="settings"
        >
          Settings
        </button>

        <div class="sidebar-bottom">

          <button
            id="logoutBtn"
            class="logout-btn"
          >
            Sign Out
          </button>

        </div>

      </aside>


      <!-- MAIN -->

      <main class="main">

        <header class="topbar">

          <div style="display:flex;align-items:center;gap:12px;">

            <button
              id="mobileMenuBtn"
              class="mobile-menu-btn"
              type="button"
            >
              ☰
            </button>

            <h1 id="moduleTitle">
              Dashboard
            </h1>

          </div>

          <div
            id="userEmail"
            class="user-email"
          ></div>

        </header>


        <div class="content">

          <p
            id="moduleDescription"
            class="module-description"
          >
            Manage your website.
          </p>

          <div id="moduleArea">

            <div
              id="moduleContent"
            ></div>

          </div>

        </div>

      </main>

    </div>

  </section>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>

  <script src="admin.js"></script>

</body>
</html>
